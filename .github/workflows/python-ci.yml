# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.13, 3.14]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dj_web_utils
          POSTGRES_PASSWORD: dj_web_utils
          POSTGRES_USER: dj_web_utils
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install antivirus
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav-daemon
          sudo systemctl start clamav-freshclam
          sleep 60
          sudo systemctl start clamav-daemon
          sleep 60
          sudo systemctl status clamav-daemon
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[dev,django,ldap,sentry]'
      - name: Lint code with Python ${{ matrix.python-version }}
        run: |
          make lint_local
      - name: Check for deadcode with Python ${{ matrix.python-version }}
        run: |
          make deadcode_local
      - name: Run test with Python ${{ matrix.python-version }}
        env:
          DJANGO_SETTINGS_MODULE: testproject.settings
          PYTHONPATH: tests:${PYTHONPATH}
        run: |
          make test_local

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lint JavaScript code
        run: |
          make lint_js
