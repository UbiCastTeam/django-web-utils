[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0"]

[project]
name = "django-web-utils"
description = "A collection of utilities for web projects based on Django."
authors = [{name = "UbiCastTeam"}]
dynamic = ["version"]
license = "LGPL-3.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.13"
dependencies = [
  "bleach[css] >= 6.0, < 7.0",
  "pillow >= 11",
  "pytz",
]

[project.optional-dependencies]
dev = [
  "django >= 6.0, < 6.1",
  "psycopg[binary] >= 3.2",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "ruff",
  "sentry-sdk",
  "vulture",
]

[project.urls]
Repository = "https://github.com/UbiCastTeam/django-web-utils"

[tool.setuptools.dynamic]
version = {attr = "django_web_utils.__version__"}

[tool.setuptools.packages.find]
include = ["django_web_utils*"]

[tool.setuptools.package-data]
"*" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.po"]

[tool.pytest.ini_options]
addopts = "--verbose --tb=native --color=yes --durations=10"
django_find_project = "false"
log_date_format = "%H:%M:%S"
log_format = "%(asctime)s.%(msecs)03d pid:%(process)d %(name)s %(levelname)s %(message)s"
log_level = "DEBUG"
norecursedirs = ".git submodules"
testpaths = ["tests/"]

[tool.coverage.run]
source_dirs = ["django_web_utils"]

[tool.ruff]
line-length = 120
indent-width = 4
respect-gitignore = true
exclude = [".git", "submodules"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = ["A", "B", "E", "F", "G", "I", "N", "Q"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.isort]
case-sensitive = false
force-sort-within-sections = true
force-wrap-aliases = true
combine-as-imports = true
forced-separate = ["tests"]
order-by-type = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
split-on-trailing-comma = true
