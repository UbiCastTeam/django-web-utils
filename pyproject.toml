[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0"]

[project]
name = "django-web-utils"
description = "A collection of utilities for web projects based on Django."
authors = [{name = "UbiCastTeam"}]
dynamic = ["version"]
license = "LGPL-3.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.13"
dependencies = [
  "nh3 >= 0.3",
  "pillow >= 12",
]

[project.optional-dependencies]
# Django is not a hard dependency to let projects manage their Django version,
# but this library is only tested with the versions below.
django = [
  "django >= 6.1, < 6.2",
]
# Required by the "ldap_utils" module.
ldap = [
  "ldap3 >= 2.9.1",
]
# Required by the "sentry_utils" module.
sentry = [
  "sentry-sdk >= 2.25",
]
dev = [
  "psycopg[binary] >= 3.2",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "ruff",
  "vulture",
]

[project.urls]
Repository = "https://github.com/UbiCastTeam/django-web-utils"

[tool.setuptools.dynamic]
version = {attr = "django_web_utils.__version__"}

[tool.setuptools.packages.find]
include = ["django_web_utils*"]

[tool.setuptools.package-data]
"*" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.po"]

[tool.pytest.ini_options]
addopts = "--verbose --tb=native --color=yes --durations=10"
django_find_project = "false"
log_date_format = "%H:%M:%S"
log_format = "%(asctime)s.%(msecs)03d pid:%(process)d %(name)s %(levelname)s %(message)s"
log_level = "DEBUG"
norecursedirs = ".git submodules"
testpaths = ["tests/"]

[tool.coverage.run]
source_dirs = ["django_web_utils"]

[tool.ruff]
line-length = 120
indent-width = 4
respect-gitignore = true
exclude = [".git", "submodules"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = ["A", "B", "DJ", "DTZ", "E", "F", "G", "I", "N", "Q", "S", "UP"]
ignore = [
  "S603",  # subprocess is always called with a list of arguments (no shell)
  "S607",  # system commands (ps, du, git, etc.) are resolved using the PATH
  "UP031",  # printf-style formatting will be migrated progressively
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ", "S101", "S105", "S106", "S108"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.isort]
case-sensitive = false
force-sort-within-sections = true
force-wrap-aliases = true
combine-as-imports = true
forced-separate = ["tests"]
order-by-type = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
split-on-trailing-comma = true

[tool.basedpyright]
# Disable type checking in IDE (Django does not support type checking)
typeCheckingMode = "off"
